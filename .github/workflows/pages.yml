name: Demo site
on:
  push:
    branches: [main]
    paths: ["docs/demo/**", "src/**"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: |
          mkdir -p _site
          pocketshelf demo -o _site/index.html
          pocketshelf demo --arabic -o _site/arabic.html
          cp docs/media/search.gif docs/media/hero.webp _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
