[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocketshelf"
version = "0.1.0"
description = "Turn any folder of PDFs, EPUBs and DJVUs (or a CSV catalog) into one self-contained offline HTML index that works from a phone's storage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Khalid Benjelloun" }]
keywords = ["ebooks", "library", "catalog", "offline", "html", "pdf", "epub", "arabic", "rtl", "calibre-alternative"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
pocketshelf = "pocketshelf.cli:main"

[project.urls]
Homepage = "https://github.com/kmbenjel/pocketshelf"
Documentation = "https://warraq.benjelloun.dev/pocketshelf/"
Demo = "https://benjelloun.dev/pocketshelf/"
Repository = "https://github.com/kmbenjel/pocketshelf"
Issues = "https://github.com/kmbenjel/pocketshelf/issues"
Changelog = "https://github.com/kmbenjel/pocketshelf/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketshelf"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pocketshelf"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]
